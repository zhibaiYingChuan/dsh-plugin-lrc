# 把本插件插入 DSH 的插件树。
#
# 安装后可用 `dsh --profile desktop --dump-config | grep dsh-plugin-lrc` 确认它真的进了树。
#
# 注意：插件参数必须写在 `config:` 下面。DSH 的 loader 只认
# `{ id, name, disabled, config }` 这几个字段，写在 entry 顶层的
# `baseUrl` / `token` 会被静默忽略 —— 表现为"配了 3111 却仍然打 3099"。
- insert:
    - id: dsh-plugin-lrc
      name: dsh-plugin-lrc
      config:
        # 留空 = 自动探测已有 LRC，没有就下载并启动隔离实例
        baseUrl: ''
        # 服务端设置了 LRC_API_TOKEN 时填这里
        token: ''
        # 记忆归属项目
        project: dsh
        # 每 8 轮沉淀一次
        offloadTurns: 8
        # 或累计 6000 字符沉淀一次
        offloadChars: 6000
        # 单次最多提炼条数
        maxItems: 40
