# 把本插件插入 DSH 的插件树。
#
# 安装后可用 `dsh --profile desktop --dump-config | grep dsh-plugin-lrc` 确认它真的进了树。
#
# 注意：插件参数必须写在 `config:` 下面。DSH 的 loader 只认
# `{ id, name, disabled, config }` 这几个字段，写在 entry 顶层的
# `baseUrl` / `token` 会被静默忽略 —— 表现为"配了 3111 却仍然打 3099"。
- insert:
    - id: dsh-plugin-lrc
      name: dsh-plugin-lrc
      config:
        # 留空 = 自动探测已有 LRC，没有就下载并启动隔离实例
        baseUrl: ''
        # 服务端设置了 LRC_API_TOKEN 时填这里
        token: ''
        # 记忆归属项目
        project: dsh
        # 每 4 轮沉淀一次
        #
        # ★2026-11-14：8 → 4。写入侧（append）是无副作用的，频率越高
        # 上下文被抽成 Fact 越早；压缩侧（trim）仍保持 0.10 不动 ——
        # 实测激进 trim 会让 KV 前缀缓存反复失效，净亏。
        offloadTurns: 4
        # 或累计 6000 字符沉淀一次
        offloadChars: 6000
        # 单次最多提炼条数
        maxItems: 40
        # ── 工件库（长文本落盘）──
        #
        # 用户粘贴的整份文档 / 超长代码不留在上下文，也不塞进 LRC
        # （否则 recall 会把长文档片段召回来）。单独落盘，LRC 只留
        # 一条指针 Fact，模型需要时用 lrc_fetch_artifact(hash) 取回。
        artifactEnabled: true
        # 超过多少字符才落盘
        artifactMinChars: 8000
        # 工件库磁盘配额（MB），超额按最久未访问淘汰
        artifactQuotaMb: 200
        # ── 关键信息提取：规则 + LLM 兜底 ──
        #
        # 规则层只能覆盖「见过的措辞」，模型表达是开放的。
        # 兜底路径用一次独立模型调用补足 —— 这是结构约束，不是提示词。
        #
        # ★2026-11-14：false → true。兜底的语义已改为「判定」而非「提取」：
        # 规则层把「结构合格但没命中谓词表」的句子放进 pending，模型只做
        # 二分类（这句值不值得记），产物原样复制、可追溯。
        #
        # 关闭期间的实测数据（session-a7f16f92 / d08bcd4c）：
        # 纯规则层的 no_claim 占正文的 90% 以上，其中「这个仓库是什么」
        # 这类定义句整类漏抽。而结构判据对「垃圾」与「真判断句」零区分力
        # （82/82 全通过），谓词白名单误杀 96% —— 只有语义能区分。
        #
        # 四道闸门仍然生效：
        # 1. 待裁决句非空（主判据）
        # 2. 类型缺口（有因果/决策/目标信号但没抽出对应类别）
        # 3. 会话配额（200 次）+ 进程窗口（500 次/小时）
        # 4. 最小间隔 5s（只防异常循环）
        #
        # LLM 只产候选，**入库仍由 validateJudgedFact 裁决**（结构底线：
        # 长度 / markdown 碎片 / 机器输出 / 提问）—— 不会重新引入
        # 「两套语义判据」的问题，因为语义只有模型一处。
        llmExtractEnabled: true
        # 会话 200 次：待裁决句几乎每轮都有，40 次会在一次长任务内用尽
        llmExtractMaxCalls: 200
        # 进程 500 次/小时：多窗口最终的硬上限
        llmExtractGlobalMaxCalls: 500
        # 间隔 5 秒：只防异常循环，总量由上面两个配额控制
        llmExtractMinIntervalMs: 5000
        # 正文短于此长度不触发兜底
        llmExtractMinChars: 120
        # 单次发送的正文上限（超出取尾部）
        llmExtractMaxInputChars: 6000
        # ── 同批折叠 ──
        #
        # 实测一个会话写入 1515 条、长度中位数仅 33 字，19.3% ≤ 20 字 ——
        # 抽取器是句子级的，同一次推理被切成一串互不相关的碎片。
        # 开启后同一批（一次 flush）的 N 条先压成 1 条摘要再入库。
        foldEnabled: true
        # 低于 4 条不折叠：2~3 条本就是一次完整表述，折叠反而损失精度
        foldMinFacts: 4
        # 摘要字符上限：正常批次约 500 字，远低于此值
        foldMaxChars: 2000
        # ── 会话纪要 ──
        #
        # 「一份对话一份纪要」：诉求演进 + 关键结论 + 真实时序，
        # 走 /v1/memories/remember 带 source_timestamp_ms（实测偏差 0.0 秒）。
        #
        # ★必须显式写在 patch 里：插件按 `!== false` 判定，
        # 但写出来能让配置可审阅、可关闭。
        minutesEnabled: true
        # 每满多少轮落一次。实测每会话轮数 p50 仅 2 轮，
        # 5 轮 + 空闲触发可覆盖绝大多数会话。
        minutesEveryTurns: 5
        # 空闲多久强制落一次（毫秒，0 = 关闭）。兜住短会话。
        minutesIdleMs: 600000
